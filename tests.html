<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Matcher tests</title>
<style>body{font:14px/1.5 monospace;padding:16px}.fail{color:#c00}.pass{color:#080}</style>
</head>
<body>
<pre id="out">running...</pre>
<script type="module">
import { buildIndex, search, similarPlaces, normalise } from './js/match.js';
import { isValid, isImportable, findCage, addCage, addSuburbToCage, renameCage, removeSuburbFromCage, deleteCage, replaceData, setPostcode, postcodeKey, applyRenames, applyUnsure, CAGE_RENAMES, LOCAL_DEST, setApproval, approvalOf, checkApprover } from './js/store.js';
import { CAPS, renameCageInSets, NAME_MAX, emptyLines, cleanSets, uniqueName, newSet, renameSet, deleteSet, mergeSets, findSet, cageParts, builtinLoops, simplifyPart, SIMPLIFY_M } from './js/lines.js';

const out = [];
let passed = 0, total = 0;
const check = (label, ok, detail) => {
  total++;
  if (ok) passed++;
  out.push(`${ok ? 'PASS' : 'FAIL'}  ${label}${detail ? '  -> ' + detail : ''}`);
};
const describe = p => p
  ? `${p.name} [${p.destinations.map(d => d.type === 'local' ? 'LOCAL ' + d.postcode : d.cage).join(' + ')}]`
  : '(no match)';

try {
  const cages = await (await fetch('data/cages.json')).json();
  const adelaide = await (await fetch('data/adelaide-suburbs.json')).json();
  const index = buildIndex({ cages: cages.cages, local: adelaide.suburbs });
  out.push(`Index: ${index.length} places\n`);

  const top = q => search(index, q)[0];
  const cagesOf = p => p ? p.destinations.map(d => d.type === 'local' ? 'LOCAL' : d.cage).sort().join('+') : '';

  // Required examples
  let r = top('Jamestown');  check('"Jamestown" -> Port Pirie', r?.name === 'Jamestown' && cagesOf(r) === 'Port Pirie', describe(r));
  r = top('Napperby');       check('"Napperby" -> Port Pirie', r?.name === 'Napperby' && cagesOf(r) === 'Port Pirie', describe(r));
  r = top('Jamstown');       check('typo "Jamstown" -> Jamestown', r?.name === 'Jamestown', describe(r));
  r = search(index, 'Sydney'); check('"Sydney" (not in list) -> no results', r.length === 0, r.map(describe).join(', ') || '(none)');

  // Normalising
  r = top('JAMES TOWN');     check('"JAMES TOWN" (caps + space) -> Jamestown', r?.name === 'Jamestown', describe(r));
  r = top('shea oak log');   check('"shea oak log" (no hyphen) -> Shea-Oak Log', r?.name === 'Shea-Oak Log', describe(r));
  r = top('Pt Macdonnell');  check('"Pt Macdonnell" -> Port MacDonnell / Mount Gambier', r?.name === 'Port MacDonnell' && cagesOf(r) === 'Mount Gambier', describe(r));
  r = top('mil lel');        check('"mil lel" -> Mil-lel', r?.name === 'Mil-lel', describe(r));

  // Multi-destination and local
  r = top('Pinkerton Plains'); check('"Pinkerton Plains" -> Kadina / Yorke Peninsula only (Pete, 2026-10-27)', cagesOf(r) === 'Kadina / Yorke Peninsula', describe(r));
  r = top('Happy Valley');   check('"Happy Valley" -> Mildura + LOCAL', cagesOf(r) === 'LOCAL+Mildura', describe(r));
  r = top('Seacliff');       check('"Seacliff" -> LOCAL', r?.name === 'Seacliff' && cagesOf(r) === 'LOCAL', describe(r));
  r = top('Gawler');         check('"Gawler" -> Barossa only (not LOCAL)', cagesOf(r) === 'Barossa', describe(r));
  r = top('Berri');          check('"Berri" (cage town) -> Berri', cagesOf(r) === 'Berri', describe(r));
  r = top('Mt Gambier');     check('"Mt Gambier" (cage town) -> Mount Gambier', cagesOf(r) === 'Mount Gambier', describe(r));

  // Look-alikes
  r = top('Paringa');        check('"Paringa" -> Renmark, not Paringi', r?.name === 'Paringa' && cagesOf(r) === 'Renmark', describe(r));
  r = top('Stirling');       check('"Stirling" -> Adelaide Hills first', r?.name === 'Stirling', describe(r));

  // Type-ahead
  r = search(index, 'jame');  check('type-ahead "jame" includes Jamestown', r.some(p => p.name === 'Jamestown'), r.map(p => p.name).join(', '));

  // Similar-name warnings
  const sim = q => similarPlaces(index, top(q)).map(p => p.name);
  r = sim('Enfield');        check('"Enfield" warns about Penfield', r.includes('Penfield'), r.join(', '));
  r = sim('Paringi');        check('"Paringi" warns about Paringa', r.includes('Paringa'), r.join(', '));
  r = sim('Newton');         check('"Newton" warns about New Town', r.includes('New Town'), r.join(', '));
  r = sim('Myponga');        check('"Myponga" warns about Mypolonga', r.includes('Mypolonga'), r.join(', '));
  r = sim('Marino');         check('"Marino" (LOCAL) warns about Marion (South Cartons since v26)', r.includes('Marion'), r.join(', ') || '(none)');
  r = sim('Hove');           check('"Hove" no warning for Robe (too short)', !r.includes('Robe'), r.join(', ') || '(none)');
  // ---------- Store ----------
  // Pure-function tests on deep copies of the shipped data. Nothing here calls
  // saveData/loadData; localStorage is snapshotted and restored just in case.
  const KEY = 'cage-finder-data-v1';
  const lsBefore = localStorage.getItem(KEY);
  try {
    const unsure = await (await fetch('data/unsure.json')).json();
    const shipped = (await (await fetch('data/postcodes.json')).json()).postcodes;
    const base = { version: 1, sheetVersion: cages.sheetVersion || 1, cages: cages.cages, local: adelaide.suburbs };
    const fresh = () => structuredClone(base);
    const J = x => JSON.stringify(x);
    const throws = fn => { try { fn(); return false; } catch { return true; } };
    const hasSub = (c, s) => c.suburbs.some(x => normalise(x) === normalise(s));
    const hasLocal = (d, s) => d.local.some(p => normalise(p.name) === normalise(s));
    out.push('\n-- Store --');

    // isValid
    check('isValid accepts default data', isValid(fresh()));
    check('isValid accepts data without a local list', isValid({ cages: [] }));
    check('isValid rejects null', isValid(null) === false);
    check('isValid rejects {}', isValid({}) === false);
    check('isValid rejects missing cages', isValid({ local: [] }) === false);
    check('isValid rejects cages that is a string', isValid({ cages: 'x' }) === false);
    check('isValid rejects cage name that is a number', isValid({ cages: [{ name: 5, color: '#112233', suburbs: [] }] }) === false);
    check('isValid rejects bad colour', isValid({ cages: [{ name: 'A', color: 'red', suburbs: [] }] }) === false);
    check('isValid rejects suburbs that is not an array', isValid({ cages: [{ name: 'A', color: '#112233', suburbs: 'x' }] }) === false);
    check('isValid rejects local that is not an array', isValid({ cages: [], local: 'x' }) === false);

    // isImportable
    check('isImportable accepts JSON round-trip of default data', isImportable(JSON.parse(J(fresh()))));
    for (const [label, junk] of [['string', 'hello'], ['number', 42], ['[]', []], ['null', null],
      ['{cages:"x"}', { cages: 'x' }],
      ['cage with no name', { cages: [{ color: '#112233', suburbs: [] }] }],
      ['non-string suburb', { cages: [{ name: 'A', color: '#112233', suburbs: [1] }] }],
      ['local entry with no name', { cages: [], local: [{ postcode: '5000' }] }]]) {
      check(`isImportable rejects ${label}`, isImportable(junk) === false);
    }

    // addCage
    {
      const d = fresh(), n = d.cages.length;
      const c = addCage(d, '  Test Cage ', '#112233');
      check('addCage returns the trimmed cage and grows the list', c.name === 'Test Cage' && d.cages.length === n + 1);
      check('addCage: new cage is findable (case-insensitive)', findCage(d, 'test cage') === c);
      check('addCage keeps cages sorted by name', J(d.cages.map(x => x.name)) === J([...d.cages.map(x => x.name)].sort((a, b) => a.localeCompare(b))));
      check('addCage rejects a duplicate name (throws, nothing added)', throws(() => addCage(d, 'TEST CAGE', '#445566')) && d.cages.length === n + 1);
      check('addCage rejects an empty name', throws(() => addCage(d, '   ', '#112233')));
    }

    // addSuburbToCage / removeSuburbFromCage
    {
      const d = fresh(), cage = d.cages[0], s = 'Zzz Testville';
      const othersBefore = J(d.cages.slice(1)), localBefore = J(d.local);
      addSuburbToCage(d, '  ' + s + ' ', cage.name);
      check('addSuburbToCage: suburb appears on the cage', cage.suburbs.includes(s));
      check('addSuburbToCage: other cages unchanged', J(d.cages.slice(1)) === othersBefore);
      check('addSuburbToCage: a non-local suburb leaves the Local list alone', J(d.local) === localBefore);
      const len = cage.suburbs.length;
      addSuburbToCage(d, s.toUpperCase(), cage.name);
      check('addSuburbToCage: same name again (other case) is not duplicated', cage.suburbs.length === len);
      check('addSuburbToCage: unknown cage throws', throws(() => addSuburbToCage(d, 'X', 'No Such Cage')));
      check('addSuburbToCage: empty suburb throws', throws(() => addSuburbToCage(d, ' ', cage.name)));
      setPostcode(d, s, cage.name, '5000');
      removeSuburbFromCage(d, cage, s);
      check('removeSuburbFromCage: suburb is gone', !cage.suburbs.includes(s));
      check('removeSuburbFromCage: other cages unchanged', J(d.cages.slice(1)) === othersBefore);
      check('removeSuburbFromCage: its typed postcode is removed too', !(postcodeKey(s, cage.name) in d.postcodes));
      check('removeSuburbFromCage: cage is back to its original suburbs', J([...cage.suburbs].sort()) === J([...cages.cages[0].suburbs].sort()));

      const d2 = fresh(), loc = d2.local[0].name;
      addSuburbToCage(d2, loc, d2.cages[0].name);
      check('addSuburbToCage: moving a Local suburb takes it off the Local list', !hasLocal(d2, loc) && hasSub(d2.cages[0], loc));
    }

    // renameCage
    {
      const d = fresh(), cage = d.cages[0], oldName = cage.name, subs = J(cage.suburbs), sub = cage.suburbs[0];
      const other = d.cages[1];
      setPostcode(d, sub, oldName, '5123');
      setPostcode(d, 'Somewhere', other.name, '5222');
      renameCage(d, cage, '  Renamed Cage ');
      check('renameCage: old name no longer found', findCage(d, oldName) === undefined);
      check('renameCage: new name found (trimmed)', findCage(d, 'renamed cage') === cage && cage.name === 'Renamed Cage');
      check('renameCage: suburbs kept', J(cage.suburbs) === subs);
      check('renameCage: postcodes move with the cage', d.postcodes[postcodeKey(sub, 'Renamed Cage')] === '5123' && !(postcodeKey(sub, oldName) in d.postcodes));
      check('renameCage: postcodes of other cages untouched', d.postcodes[postcodeKey('Somewhere', other.name)] === '5222');
      check('renameCage: to another cage name throws', throws(() => renameCage(d, cage, other.name)));
      check('renameCage: empty name throws', throws(() => renameCage(d, cage, '  ')));
      renameCage(d, cage, 'RENAMED CAGE');
      check('renameCage: changing only the case is allowed', cage.name === 'RENAMED CAGE');
    }

    // deleteCage
    {
      const d = fresh(), cage = d.cages[2], n = d.cages.length;
      const othersBefore = J(d.cages.filter(c => c !== cage));
      setPostcode(d, 'Foo', cage.name, '5000');
      setPostcode(d, 'Foo', d.cages[0].name, '5001');
      deleteCage(d, cage);
      check('deleteCage: cage is gone', findCage(d, cage.name) === undefined && d.cages.length === n - 1);
      check('deleteCage: other cages untouched', J(d.cages) === othersBefore);
      check('deleteCage: its postcodes removed, others kept', !(postcodeKey('Foo', cage.name) in d.postcodes) && postcodeKey('Foo', d.cages[0].name) in d.postcodes);
    }

    // setPostcode / postcodeKey
    {
      const d = fresh();
      setPostcode(d, 'Happy Valley', 'Mildura', ' 3500 ');
      setPostcode(d, 'Happy Valley', LOCAL_DEST, '5159');
      check('setPostcode/postcodeKey round trip (cage)', d.postcodes[postcodeKey('happy  valley', 'MILDURA')] === '3500');
      check('setPostcode: Local destination is a separate key', d.postcodes[postcodeKey('Happy Valley', 'local')] === '5159' && postcodeKey('Happy Valley', LOCAL_DEST).endsWith('|local'));
      setPostcode(d, 'Happy Valley', 'Mildura', '');
      check('setPostcode: empty string is stored (means "none")', d.postcodes[postcodeKey('Happy Valley', 'Mildura')] === '');
      check('setPostcode: rejects non-4-digit', throws(() => setPostcode(d, 'X', 'Y', '12a4')) && throws(() => setPostcode(d, 'X', 'Y', '123')));
    }

    // replaceData
    {
      const original = fresh();
      const copy = fresh();
      copy.cages.pop(); copy.local = []; copy.sheetVersion = 99;
      replaceData(copy, JSON.parse(J(original)));
      check('replaceData: cages deep-equal the original', J(copy.cages) === J(original.cages));
      check('replaceData: local deep-equal the original', J(copy.local) === J(original.local));
      check('replaceData: sheetVersion and version copied', copy.sheetVersion === original.sheetVersion && copy.version === 1);
      check('replaceData: markers default to 0, postcodes to {}', copy.unsureApplied === 0 && copy.renamesApplied === 0 && J(copy.postcodes) === '{}');
      const d = fresh();
      replaceData(d, { cages: [], local: [], unsureApplied: 3, renamesApplied: 2,
        postcodes: { 'a|b': '5000', 'c|local': '', 'd|e': 'abcd', 'nobar': '5000', 'f|g': 12 } });
      check('replaceData: copies markers, keeps only well-formed postcodes',
        d.unsureApplied === 3 && d.renamesApplied === 2 && J(Object.keys(d.postcodes).sort()) === J(['a|b', 'c|local']));
    }

    // Approvals (v19)
    {
      const d = fresh(), cage = d.cages[0], other = d.cages[1], s = 'Zzz Testville';
      addSuburbToCage(d, s, cage.name);
      setApproval(d, s, cage.name, '  Dave ');
      const a = approvalOf(d, s, cage.name);
      check('setApproval: stores trimmed name and a YYYY-MM-DD date', a?.by === 'Dave' && /^\d{4}-\d{2}-\d{2}$/.test(a.at), J(a));
      d.approvals[postcodeKey(s, cage.name)].at = '2020-01-01';
      setApproval(d, s, cage.name, 'Dave');
      check('setApproval: same name again keeps the first date', approvalOf(d, s, cage.name).at === '2020-01-01');
      setApproval(d, s, cage.name, 'Sam');
      check('setApproval: a new name gets a new date', approvalOf(d, s, cage.name).by === 'Sam' && approvalOf(d, s, cage.name).at !== '2020-01-01');
      check('checkApprover: too long throws', throws(() => checkApprover('x'.repeat(61))) && checkApprover(' Jo ') === 'Jo');
      setApproval(d, 'Other Place', other.name, 'Kim');
      const oldName = cage.name;
      renameCage(d, cage, 'Renamed For Approval');
      check('renameCage: approval moves with the cage', approvalOf(d, s, 'Renamed For Approval')?.by === 'Sam' && !approvalOf(d, s, oldName));
      check('renameCage: first name kept as sheetName', cage.sheetName === oldName);
      renameCage(d, cage, 'Renamed Again');
      check('renameCage: sheetName not overwritten by a second rename', cage.sheetName === oldName);
      removeSuburbFromCage(d, cage, s);
      check('removeSuburbFromCage: its approval is removed', !approvalOf(d, s, cage.name));
      setApproval(d, 'Foo', cage.name, 'Lee');
      deleteCage(d, cage);
      check('deleteCage: its approvals removed, others kept', !approvalOf(d, 'Foo', 'Renamed Again') && approvalOf(d, 'Other Place', other.name)?.by === 'Kim');
      setApproval(d, 'Other Place', other.name, '');
      check('setApproval: empty name removes it', !approvalOf(d, 'Other Place', other.name));
      const r = fresh();
      replaceData(r, { cages: [], local: [], approvals: { 'a|b': { by: 'Dave', at: '2026-10-24' }, 'c|d': { by: '  ', at: '2026-10-24' },
        'e|f': { by: 'X' }, 'nobar': { by: 'Y', at: '2026-10-24' }, 'g|h': 'Dave' } });
      check('replaceData: keeps only well-formed approvals', J(r.approvals) === J({ 'a|b': { by: 'Dave', at: '2026-10-24' } }), J(r.approvals));
      const n = fresh(), first = n.cages[0], firstName = first.name;
      renameCage(n, first, 'Moved Away');
      check('addCage: refuses a renamed cage\'s sheet name', throws(() => addCage(n, firstName, '#112233')));
      check('renameCage: refuses another cage\'s sheet name', throws(() => renameCage(n, findCage(n, n.cages.find(c => c !== first).name), firstName)));
      renameCage(n, first, firstName);
      check('renameCage: a cage can take its own sheet name back', first.name === firstName);
      const [uCage, uNames] = Object.entries(unsure.cages)[0];
      const u = fresh();
      setApproval(u, uNames[0], uCage, 'Dave');
      applyUnsure(u, unsure, shipped);
      check('applyUnsure: drops the approval of a suburb it moves to Local', !approvalOf(u, uNames[0], uCage));
    }

    // applyRenames
    {
      const once = fresh();
      const r1 = applyRenames(once);
      const snap = J(once);
      const r2 = applyRenames(once);
      check('applyRenames: second run changes nothing (idempotent)', J(once) === snap && r2 === false, `first returned ${r1}`);
      check('applyRenames: renamesApplied set to newest id', once.renamesApplied === CAGE_RENAMES.at(-1).id);
      check('applyRenames: every rename target exists, old name gone', CAGE_RENAMES.every(r => findCage(once, r.to) && !findCage(once, r.from)));
      const d = { cages: [{ name: 'Kadina', color: '#112233', suburbs: ['Moonta'] }], postcodes: { [postcodeKey('Moonta', 'Kadina')]: '5558' } };
      applyRenames(d);
      check('applyRenames: renames an old-named cage and moves its postcodes',
        d.cages[0].name === 'Kadina / Yorke Peninsula' && d.postcodes[postcodeKey('Moonta', 'Kadina / Yorke Peninsula')] === '5558'
        && !(postcodeKey('Moonta', 'Kadina') in d.postcodes), J(d.postcodes));
      const kept = { cages: [{ name: 'Kadina', color: '#112233', suburbs: [] }], renamesApplied: 1 };
      applyRenames(kept);
      check('applyRenames: skips a rename already applied (device name stays)', kept.cages[0].name === 'Kadina');
    }

    // applyUnsure
    {
      const d = fresh();
      const before = d.cages.reduce((n, c) => n + c.suburbs.length, 0);
      const r1 = applyUnsure(d, unsure, shipped);
      const afterOnce = J(d);
      const afterCount = d.cages.reduce((n, c) => n + c.suburbs.length, 0);
      const r2 = applyUnsure(d, unsure, shipped);
      check('applyUnsure: runs once, second call is a no-op', r1 === true && r2 === false && J(d) === afterOnce);
      check('applyUnsure: unsureApplied set to the list version', d.unsureApplied === unsure.version);
      d.unsureApplied = 0;
      applyUnsure(d, unsure, shipped);
      check('applyUnsure: forced second pass gives the same data (idempotent)', J(d) === afterOnce);
      const stillThere = [], missingLocal = [];
      for (const [cn, names] of Object.entries(unsure.cages)) {
        const c = findCage(d, cn);
        for (const n of names) {
          if (c && hasSub(c, n)) stillThere.push(`${n} (${cn})`);
          if (!hasLocal(d, n)) missingLocal.push(n);
        }
      }
      check('applyUnsure: no moved suburb still sits on its Cartons cage', stillThere.length === 0, stillThere.slice(0, 10).join(', '));
      check('applyUnsure: every moved suburb is now in the Local list', missingLocal.length === 0, missingLocal.slice(0, 10).join(', '));
      const total = Object.values(unsure.cages).reduce((n, a) => n + a.length, 0);
      check('applyUnsure: cage suburb count dropped by the list size', before - afterCount === total, `${before} -> ${afterCount}, list ${total}`);
      const sorted = d.local.every((p, i) => i === 0 || d.local[i - 1].name.localeCompare(p.name) <= 0);
      check('applyUnsure: Local list left sorted', sorted);

      // Typed postcode moves with the suburb; shipped code used when exactly one.
      const [cn, names] = Object.entries(unsure.cages)[0];
      const s = cages.cages.find(c => c.name === cn).suburbs.find(x => normalise(x) === normalise(names[0]));
      const d3 = fresh();
      setPostcode(d3, s, cn, '5999');
      applyUnsure(d3, unsure, shipped);
      check('applyUnsure: a typed "suburb|cage" postcode moves to "suburb|local"',
        d3.postcodes[postcodeKey(s, LOCAL_DEST)] === '5999' && !(postcodeKey(s, cn) in d3.postcodes));
      const codes = shipped[normalise(s)] || [];
      const lp = d3.local.find(p => normalise(p.name) === normalise(s));
      check('applyUnsure: Local entry gets the shipped postcode when there is exactly one', !!lp && lp.postcode === (codes.length === 1 ? codes[0] : ''));
      const d4 = fresh(); d4.unsureApplied = unsure.version;
      const d4copy = J(d4);
      check('applyUnsure: already-applied version does nothing', applyUnsure(d4, unsure, shipped) === false && J(d4) === d4copy);

      // A device that applied an older list: only the restore steps run, nothing is re-hidden.
      const restoreSteps = Object.entries(unsure.restore || {}).filter(([v]) => Number(v) > 1);
      if (unsure.version > 1 && restoreSteps.length) {
        const merged = {};
        for (const [c, ns] of Object.entries(unsure.cages)) merged[c] = [...ns];
        for (const [, cs] of restoreSteps) for (const [c, ns] of Object.entries(cs)) merged[c] = [...(merged[c] || []), ...ns];
        const old = fresh();
        applyUnsure(old, { version: 1, cages: merged }, shipped);
        const [keptCage, keptNames] = Object.entries(unsure.cages).find(([, ns]) => ns.length);
        const movedBack = cages.cages.find(c => c.name === keptCage).suburbs.find(x => normalise(x) === normalise(keptNames[0]));
        addSuburbToCage(old, movedBack, keptCage); // Lyric moved one back by hand
        const [rCage, rNames] = Object.entries(restoreSteps[0][1])[0];
        setPostcode(old, rNames[0], LOCAL_DEST, '5999');
        const r = applyUnsure(old, unsure, shipped);
        const notBack = [], stillLocal = [];
        for (const [, cs] of restoreSteps) for (const [c, ns] of Object.entries(cs)) for (const n of ns) {
          if (!hasSub(findCage(old, c), n)) notBack.push(`${n} (${c})`);
          if (hasLocal(old, n)) stillLocal.push(n);
        }
        check('applyUnsure restore: every restored suburb back on its cage', r === true && notBack.length === 0, notBack.slice(0, 10).join(', '));
        check('applyUnsure restore: restored suburbs gone from Local', stillLocal.length === 0, stillLocal.slice(0, 10).join(', '));
        check('applyUnsure restore: a suburb moved back by hand is not re-hidden', hasSub(findCage(old, keptCage), movedBack) && !hasLocal(old, movedBack));
        check('applyUnsure restore: typed Local postcode moves to the cage',
          old.postcodes[postcodeKey(rNames[0], rCage)] === '5999' && !(postcodeKey(rNames[0], LOCAL_DEST) in old.postcodes));
        check('applyUnsure restore: unsureApplied set, second call is a no-op', old.unsureApplied === unsure.version && applyUnsure(old, unsure, shipped) === false);
        const direct = fresh(); applyUnsure(direct, unsure, shipped);
        addSuburbToCage(direct, movedBack, keptCage);
        const shape = x => J(x.cages.map(c => [c.name, [...c.suburbs].sort()])); // membership; adding re-sorts a cage
        check('applyUnsure restore: cages end up the same as a fresh install', shape(old) === shape(direct));
        const elsewhere = fresh();
        applyUnsure(elsewhere, { version: 1, cages: merged }, shipped);
        const other = elsewhere.cages.find(c => normalise(c.name) !== normalise(rCage));
        addSuburbToCage(elsewhere, rNames[0], other.name); // moved to a different cage by hand
        applyUnsure(elsewhere, unsure, shipped);
        check('applyUnsure restore: skips a suburb moved to another cage', !hasSub(findCage(elsewhere, rCage), rNames[0]) && hasSub(other, rNames[0]));
        const renamed = fresh();
        applyUnsure(renamed, { version: 1, cages: merged }, shipped);
        renameCage(renamed, findCage(renamed, rCage), 'Renamed On Phone');
        applyUnsure(renamed, unsure, shipped);
        check('applyUnsure restore: finds a cage renamed on the device by its sheet name',
          rNames.every(n => hasSub(findCage(renamed, 'Renamed On Phone'), n) && !hasLocal(renamed, n)));
      }
    }
  } finally {
    // Restore the browser's own saved data if anything touched it.
    if (localStorage.getItem(KEY) !== lsBefore) {
      if (lsBefore === null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, lsBefore);
    }
  }
  check('Store tests left localStorage data unchanged', localStorage.getItem(KEY) === lsBefore);

  // ---------- Line sets ----------
  // Plain state objects only; the real 'cage-lines' key is never read or written.
  {
    out.push('\n-- Line sets --');
    const sq = [[-34.9, 138.6], [-34.9, 138.7], [-35, 138.7], [-35, 138.6]];
    const J = x => JSON.stringify(x);
    const st = emptyLines();
    check('emptyLines shape', J(st) === J({ version: 1, active: 'builtin', compare: null, sets: [] }));

    const cleaned = cleanSets([
      { id: 'a', name: '  Pete  ', loops: { City: [sq, [[0, 0], [1, 1]]], Port: [[[95, 0], [0, 0], [1, 1]]], Bad: 'x' } },
      { id: 'b', name: '   ', loops: {} },
      { id: 'c', name: 5, loops: {} },
      { id: 'd', name: 'NoLoops', loops: null },
      { name: 'x'.repeat(60), loops: { North: [[...sq, ['a', 1]]] } },
      null,
    ]);
    check('cleanSets keeps good sets and drops bad names/loops', cleaned.length === 2, cleaned.map(s => s.name).join('|'));
    check('cleanSets trims the name', cleaned[0].name === 'Pete');
    check('cleanSets drops short parts and cages left with none', J(Object.keys(cleaned[0].loops)) === '["City"]' && cleaned[0].loops.City.length === 1);
    check('cleanSets drops bad points then short parts', cleaned[1].loops.North.length === 1 && cleaned[1].loops.North[0].length === 4);
    check('cleanSets slices long names and makes an id', cleaned[1].name.length === NAME_MAX && cleaned[1].id.length > 0);
    check('cleanSets of a non-array is []', J(cleanSets('x')) === '[]' && J(cleanSets({})) === '[]');

    const src = { City: [sq.map(p => [...p])] };
    const s1 = newSet(st, 'Pete', src);
    src.City[0][0][0] = 1;
    check('newSet deep-copies the loops', s1.loops.City[0][0][0] === -34.9);
    check('newSet adds to state', st.sets.length === 1 && findSet(st, s1.id) === s1);
    check('uniqueName gives "Pete (2)"', uniqueName(st, 'pete') === 'pete (2)' && uniqueName(st, 'Pete') === 'Pete (2)');
    check('uniqueName treats built-in as taken', uniqueName(st, 'built-in') === 'built-in (2)');
    check('newSet renames a clash', newSet(st, 'Pete', {}).name === 'Pete (2)');

    check('renameSet trims', renameSet(st, s1.id, '  Dave ') && s1.name === 'Dave');
    check('renameSet refuses empty', renameSet(st, s1.id, '   ') === false && s1.name === 'Dave');
    check('renameSet to its own name is fine', renameSet(st, s1.id, 'dave') && s1.name === 'dave');

    st.active = s1.id; st.compare = s1.id;
    check('deleteSet resets active and compare', deleteSet(st, s1.id) && st.active === 'builtin' && st.compare === null && !findSet(st, s1.id));
    check('deleteSet of a missing id is false', deleteSet(st, 'nope') === false);

    const m = emptyLines();
    newSet(m, 'Pete', {});
    const before = m.sets[0];
    const added = mergeSets(m, [{ id: before.id, name: 'Pete', loops: { City: [sq] } }, { name: '', loops: {} }, { name: 'Other', loops: {} }]);
    check('mergeSets returns the number added', added === 2);
    check('mergeSets renames clashes, fresh ids, never overwrites',
      m.sets.length === 3 && m.sets[1].name === 'Pete (2)' && m.sets[1].id !== before.id && m.sets[0] === before && J(before.loops) === '{}');

    const set = { id: 'z', name: 'Z', loops: { 'north  east': [sq] } };
    check('cageParts matches case/spacing-insensitively', cageParts(set, 'North East').length === 1 && cageParts(set, 'City').length === 0 && cageParts(null, 'City').length === 0);

    const lm = new Map([[normalise('North East'), { parts: [sq], within: [0.4] }], [normalise('Old Name'), { parts: [sq], within: [1] }]]);
    const bl = builtinLoops(lm, [{ name: 'North East', color: '#111111', suburbs: [] }]);
    check('builtinLoops uses live cage names', J(Object.keys(bl)) === J(['North East', normalise('Old Name')]));
    bl['North East'][0][0][0] = 1;
    check('builtinLoops deep-copies', lm.get(normalise('North East')).parts[0][0][0] === -34.9);

    // Caps, rename and re-import (from the review)
    const pt = i => [-34.9 - i * 1e-5, 138.6];
    const bigPart = n => Array.from({ length: n }, (_, i) => pt(i));
    const capped = cleanSets([{ name: 'Big', loops: { ['  ' + 'k'.repeat(120) + '  ']: Array.from({ length: 25 }, () => bigPart(5)), City: [bigPart(CAPS.points + 10)] } }]);
    check('cleanSets trims and caps cage keys', Object.keys(capped[0].loops).every(k => k.length <= CAPS.cageKey) && Object.keys(capped[0].loops).includes('k'.repeat(CAPS.cageKey)));
    check('cleanSets caps parts per cage', capped[0].loops['k'.repeat(CAPS.cageKey)].length === CAPS.parts);
    check('cleanSets caps points per part', capped[0].loops.City[0].length === CAPS.points);
    const manyCages = {};
    for (let i = 0; i < CAPS.cages + 20; i++) manyCages['cage' + i] = [bigPart(3)];
    check('cleanSets caps cages per set', Object.keys(cleanSets([{ name: 'M', loops: manyCages }])[0].loops).length === CAPS.cages);
    check('cleanSets caps the number of sets', cleanSets(Array.from({ length: CAPS.sets + 5 }, (_, i) => ({ name: 'S' + i, loops: {} }))).length === CAPS.sets);

    const rs = { sets: [{ id: '1', name: 'A', loops: { 'North East': [sq], Port: [sq] } }, { id: '2', name: 'B', loops: { City: [sq] } }] };
    check('renameCageInSets moves loops to the new name', renameCageInSets(rs, 'north east', 'Northeast Cartons') && rs.sets[0].loops['Northeast Cartons'].length === 1 && !rs.sets[0].loops['North East']);
    check('renameCageInSets reports no change', renameCageInSets(rs, 'Nowhere', 'X') === false);
    renameCageInSets(rs, 'Port', 'northeastcartons');
    check('renameCageInSets appends to an existing key', rs.sets[0].loops['Northeast Cartons'].length === 2 && !rs.sets[0].loops.Port);

    const mg = emptyLines();
    const pack = [{ name: 'Pete', loops: { City: [sq] } }];
    check('mergeSets adds a new set', mergeSets(mg, pack) === 1);
    check('mergeSets skips an identical re-import', mergeSets(mg, pack) === 0 && mg.sets.length === 1);
    check('mergeSets skips identical regardless of name case', mergeSets(mg, [{ name: 'PETE', loops: { City: [sq] } }]) === 0);
    check('mergeSets still adds same name with different loops', mergeSets(mg, [{ name: 'Pete', loops: { City: [sq.slice(0, 3)] } }]) === 1 && mg.sets[1].name === 'Pete (2)');

    // A straight edge traced every ~10 m, then a corner: thinned to the 3 corners.
    const dense = [];
    for (let i = 0; i <= 100; i++) dense.push([-34.9, 138.6 + i * 0.0001]);
    for (let i = 1; i <= 100; i++) dense.push([-34.9 - i * 0.0001, 138.61]);
    const thin = simplifyPart(dense, SIMPLIFY_M);
    check('simplifyPart thins straight runs, keeps corners', J(thin) === J([dense[0], dense[100], dense[200]]), J(thin));
    const tiny = [[-34.9, 138.6], [-34.90001, 138.6], [-34.90001, 138.60001], [-34.9, 138.60001]];
    check('simplifyPart never leaves under 3 points', simplifyPart(tiny, SIMPLIFY_M).length === 4);
    check('simplifyPart returns a copy', simplifyPart(dense, SIMPLIFY_M)[0] !== dense[0]);
  }

  // ---------- Data files ----------
  out.push('\n-- Data files --');
  const D = {};
  for (const f of ['cages', 'adelaide-suburbs', 'estimated', 'postcodes', 'unsure', 'suburb-points', 'region-loops']) {
    try {
      const resp = await fetch(`data/${f}.json`, { cache: 'reload' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      D[f] = await resp.json();
      check(`data/${f}.json loads and parses`, true);
    } catch (e) {
      check(`data/${f}.json loads and parses`, false, e.message);
    }
  }
  const list = (a, n = 10) => a.slice(0, n).join('; ') + (a.length > n ? ` (+${a.length - n} more)` : '');
  const blank = s => typeof s !== 'string' || !s.trim();
  const dups = arr => { const seen = new Set(), d = new Set(); for (const s of arr) { const k = normalise(s); if (seen.has(k)) d.add(s); seen.add(k); } return [...d]; };

  if (D.cages) {
    const cs = D.cages.cages;
    check('cages.json has a cages array', Array.isArray(cs) && cs.length > 0);
    if (Array.isArray(cs)) {
      const noName = cs.map((c, i) => [c, i]).filter(([c]) => blank(c.name)).map(([, i]) => `cage #${i}`);
      check('Every cage has a non-empty name', noName.length === 0, list(noName));
      const badCol = cs.filter(c => !/^#[0-9a-fA-F]{6}$/.test(c.color)).map(c => `${c.name}: ${c.color}`);
      check('Every cage has a #RRGGBB colour', badCol.length === 0, list(badCol));
      const noSubs = cs.filter(c => !Array.isArray(c.suburbs) || c.suburbs.length === 0).map(c => c.name);
      check('Every cage has a non-empty suburbs array', noSubs.length === 0, list(noSubs));
      const dupNames = dups(cs.map(c => c.name));
      check('No duplicate cage names', dupNames.length === 0, list(dupNames));
      const blanks = [], dupSubs = [];
      for (const c of cs) {
        if (!Array.isArray(c.suburbs)) continue;
        for (const s of c.suburbs) if (blank(s)) blanks.push(c.name);
        for (const s of dups(c.suburbs.filter(x => !blank(x)))) dupSubs.push(`${s} (${c.name})`);
      }
      check('No blank suburbs in any cage', blanks.length === 0, list(blanks));
      check('No duplicate suburbs within a cage', dupSubs.length === 0, list(dupSubs));
      const where = new Map();
      for (const c of cs) for (const s of c.suburbs || []) if (!blank(s)) {
        const k = normalise(s);
        if (!where.has(k)) where.set(k, new Set());
        where.get(k).add(c.name);
      }
      const cross = [...where.entries()].filter(([, v]) => v.size > 1).map(([k, v]) => `${k} [${[...v].join(' + ')}]`);
      out.push(`INFO  ${cross.length} suburb(s) listed on more than one cage (allowed): ${list(cross)}`);
    }
    check('sheetVersion is a positive integer', Number.isInteger(D.cages.sheetVersion) && D.cages.sheetVersion > 0, String(D.cages.sheetVersion));
  }

  if (D['adelaide-suburbs']) {
    const sub = D['adelaide-suburbs'].suburbs;
    check('adelaide-suburbs.json has a suburbs array', Array.isArray(sub) && sub.length > 0);
    if (Array.isArray(sub)) {
      const names = sub.map(p => p && p.name);
      const bl = names.map((n, i) => [n, i]).filter(([n]) => blank(n)).map(([, i]) => `entry #${i}`);
      check('adelaide-suburbs: no blank names', bl.length === 0, list(bl));
      const dp = dups(names.filter(n => !blank(n)));
      check('adelaide-suburbs: no duplicate names', dp.length === 0, list(dp));
      const badPc = sub.filter(p => !/^\d{4}$/.test(String(p && p.postcode))).map(p => `${p && p.name}: ${p && p.postcode}`);
      check('adelaide-suburbs: every postcode is 4 digits', badPc.length === 0, list(badPc));
    }
  }

  if (D.postcodes) {
    const pc = D.postcodes.postcodes;
    check('postcodes.json has a postcodes object', !!pc && typeof pc === 'object' && !Array.isArray(pc));
    if (pc && typeof pc === 'object') {
      const bad = [];
      for (const [k, v] of Object.entries(pc)) {
        const arr = Array.isArray(v) ? v : [v];
        if (arr.length === 0 || !arr.every(x => /^\d{4}$/.test(String(x)))) bad.push(`${k}: ${JSON.stringify(v)}`);
      }
      check('postcodes.json: every postcode is 4 digits', bad.length === 0, list(bad));
    }
  }

  if (D.estimated && D.cages) {
    const ec = D.estimated.cages;
    check('estimated.json has a cages array', Array.isArray(ec));
    if (Array.isArray(ec) && Array.isArray(D.cages.cages)) {
      const have = new Set(D.cages.cages.map(c => normalise(c.name)));
      const missing = ec.filter(n => !have.has(normalise(n)));
      check('Every cage in estimated.json exists in cages.json', missing.length === 0, list(missing));
    }
    // v21: postcodes inside each region map, shown when EST is tapped.
    const areas = D.estimated.areas;
    check('estimated.json has an areas object', !!areas && typeof areas === 'object' && !Array.isArray(areas));
    if (areas && Array.isArray(ec)) {
      const noArea = ec.filter(n => !Array.isArray(areas[n]) || !areas[n].length);
      check('Every estimated cage has map postcodes', noArea.length === 0, list(noArea));
      const notEst = Object.keys(areas).filter(n => !ec.includes(n));
      check('Every map-postcodes cage is in the estimated list', notEst.length === 0, list(notEst));
      const bad = [];
      for (const [cage, codes] of Object.entries(areas)) {
        if (!Array.isArray(codes)) { bad.push(`${cage}: not a list`); continue; }
        codes.forEach((a, i) => {
          if (!/^5\d{3}$/.test(a?.code)) bad.push(`${cage}: bad code ${JSON.stringify(a?.code)}`);
          else if (i && Number(a.code) <= Number(codes[i - 1].code)) bad.push(`${cage}: ${a.code} out of order or repeated`);
          if (!Array.isArray(a?.suburbs) || !a.suburbs.length || !a.suburbs.every(s => typeof s?.name === 'string' && s.name.trim()))
            bad.push(`${cage} ${a?.code}: suburbs missing or unnamed`);
        });
      }
      check('Map postcodes: SA codes in order, each with named suburbs', bad.length === 0, list(bad));
    }
  }

  if (D.unsure && D.cages) {
    const u = D.unsure;
    check('unsure.json version is a positive integer', Number.isInteger(u.version) && u.version > 0, String(u.version));
    check('unsure.json has a cages object', !!u.cages && typeof u.cages === 'object');
    if (u.cages && Array.isArray(D.cages.cages)) {
      const noCage = [], notOn = [];
      for (const [cn, names] of Object.entries(u.cages)) {
        const c = D.cages.cages.find(x => normalise(x.name) === normalise(cn));
        if (!c) { noCage.push(cn); continue; }
        const have = new Set(c.suburbs.map(normalise));
        for (const n of names) if (!have.has(normalise(n))) notOn.push(`${n} (${cn})`);
      }
      check('Every cage named in unsure.json exists in cages.json', noCage.length === 0, list(noCage));
      check('Every suburb in unsure.json is on the cage it claims', notOn.length === 0, list(notOn));
      const badStep = [], badName = [];
      for (const [v, cs] of Object.entries(u.restore || {})) {
        if (!(Number.isInteger(Number(v)) && Number(v) > 1 && Number(v) <= u.version)) badStep.push(v);
        for (const [cn, names] of Object.entries(cs)) {
          const c = D.cages.cages.find(x => normalise(x.name) === normalise(cn));
          const listed = new Set((u.cages[cn] || []).map(normalise));
          for (const n of names) if (!c || !c.suburbs.some(s => normalise(s) === normalise(n)) || listed.has(normalise(n))) badName.push(`${n} (${cn})`);
        }
      }
      check('unsure.json restore steps are versions 2..version', badStep.length === 0, list(badStep));
      check('Every restored suburb is on its cage in cages.json and off the unsure list', badName.length === 0, list(badName));
    }
  }

  // Map points (v22): one lat/lng per suburb, used by the street map.
  if (D['suburb-points']) {
    const rows = D['suburb-points'].suburbs;
    check('suburb-points.json has 400+ rows', Array.isArray(rows) && rows.length >= 400, String(rows?.length));
    if (Array.isArray(rows)) {
      const badRow = rows.filter(r => !(Array.isArray(r) && r.length === 4 && typeof r[0] === 'string' && r[0].trim()
        && typeof r[1] === 'string' && /^\d{4}$/.test(r[1]) && typeof r[2] === 'number' && typeof r[3] === 'number')).map(r => JSON.stringify(r));
      check('suburb-points.json: each row is [name, 4-digit postcode, lat, lng]', badRow.length === 0, list(badRow));
      const outside = rows.filter(r => !(r[2] >= -35.7 && r[2] <= -34.4 && r[3] >= 138.3 && r[3] <= 139.2)).map(r => r[0]);
      check('suburb-points.json: every point is inside greater Adelaide', outside.length === 0, list(outside));
      const dupPts = dups(rows.map(r => r[0]));
      check('suburb-points.json: no duplicate names', dupPts.length === 0, list(dupPts));
      const have = new Set(rows.map(r => normalise(r[0])));
      if (D.cages && Array.isArray(D.cages.cages)) {
        const miss = [];
        for (const c of D.cages.cages) if (/cartons/i.test(c.name)) for (const s of c.suburbs || []) if (!have.has(normalise(s))) miss.push(`${s} (${c.name})`);
        check('Every Cartons suburb has a map point', miss.length === 0, list(miss, 30));
      }
      if (D['adelaide-suburbs']) {
        const subs = D['adelaide-suburbs'].suburbs || [];
        const miss = subs.map(s => s?.name ?? s).filter(n => !have.has(normalise(n)));
        check('Every adelaide-suburbs.json name has a map point', miss.length === 0, list(miss, 30));
      }
    }
  }

  // Region-map loops (v22): the traced Cartons lines drawn on the street map.
  if (D['region-loops']) {
    const loops = D['region-loops'].loops;
    check('region-loops.json has a loops array', Array.isArray(loops));
    if (Array.isArray(loops)) {
      const names = new Set((D.cages?.cages || []).map(c => normalise(c.name)));
      const noCage = loops.filter(l => !names.has(normalise(l.cage))).map(l => l.cage);
      check('Every region loop is for a cage in cages.json', noCage.length === 0, list(noCage));
      const bad = loops.filter(l => !(Array.isArray(l.points) && l.points.length >= 3 && l.points.every(p => p[0] >= -35.7 && p[0] <= -34.4 && p[1] >= 138.3 && p[1] <= 139.2))).map(l => l.cage);
      check('Every region loop has 3+ points inside greater Adelaide', bad.length === 0, list(bad));
      const est = new Set((D.estimated?.cages || []).map(normalise));
      const noLoop = [...est].filter(k => !loops.some(l => normalise(l.cage) === k));
      check('Every estimated cage has a region loop', noLoop.length === 0, list(noLoop));
    }
  }

} catch (e) {
  out.push('ERROR ' + e.stack);
}

out.push(`\nRESULT: ${passed}/${total} passed`);
document.getElementById('out').textContent = out.join('\n');
</script>
</body>
</html>
