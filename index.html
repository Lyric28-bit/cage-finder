<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<title>Cage Notes</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cage Notes">
</head>
<body>

<!-- Search + the note (cage list, editable inline) -->
<section id="view-search" class="view">
  <header class="topbar">
    <h1>Notes</h1>
    <button id="btn-menu" class="btn-ghost btn-menu" type="button" aria-label="More" aria-expanded="false">⋯</button>
  </header>
  <div id="menu" class="menu" hidden></div>

  <div class="search-box">
    <input id="search" type="search" placeholder="Search notes" autocomplete="off"
           autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"
           aria-label="Suburb">
  </div>

  <button id="btn-update" class="message update" type="button" hidden>New version ready. Tap to update.</button>
  <p id="message" class="message" hidden></p>

  <article id="note-results" class="note" aria-live="polite" hidden></article>

  <div id="not-found" class="not-found" hidden>
    <p>No match for "<span id="not-found-text"></span>"</p>
    <button id="btn-add-unknown" class="btn-secondary" type="button">Add to a cage</button>
  </div>

  <article id="manage-root" class="note"></article>
</section>

<!-- Result -->
<section id="view-result" class="view" hidden>
  <div id="result-warning" class="result-warning" hidden></div>
  <div id="result-typed" class="result-typed" hidden></div>
  <div id="result-bands" class="result-bands"></div>
  <div id="result-similar" class="result-similar" hidden></div>
  <div class="result-actions">
    <button id="btn-result-move" class="btn-secondary" type="button" hidden>Move to cage</button>
    <button id="btn-check-photo" class="btn-next" type="button" hidden>Check picture</button>
    <button id="btn-next" class="btn-next" type="button">Done</button>
  </div>
</section>

<!-- Add / move a suburb to a cage -->
<dialog id="dlg-add">
  <form id="form-add" method="dialog">
    <h2 id="dlg-add-title">Add to a cage</h2>
    <label>Suburb
      <input id="add-suburb" type="text" required autocomplete="off" autocapitalize="words">
    </label>
    <label>Postcode <span class="optional">(optional)</span>
      <input id="add-postcode" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="e.g. 5121">
    </label>
    <label>Cage
      <select id="add-cage"></select>
    </label>
    <label>Approved by <span class="optional">(needed if not on the sheets)</span>
      <input id="add-approver" type="text" maxlength="60" autocomplete="off" autocapitalize="words" placeholder="e.g. Dave, supervisor">
    </label>
    <div id="add-new-cage" hidden>
      <label>New cage name
        <input id="add-new-name" type="text" autocomplete="off" autocapitalize="words">
      </label>
      <label>Colour
        <input id="add-new-color" type="color" value="#2E7D32">
      </label>
    </div>
    <p id="add-error" class="error" hidden></p>
    <div class="dlg-actions">
      <button type="button" id="btn-add-cancel" class="btn-ghost">Cancel</button>
      <button type="submit" id="btn-add-save" class="btn-primary">Save</button>
    </div>
  </form>
</dialog>

<!-- Sheet photo, full screen. Tap to zoom. -->
<dialog id="dlg-photo">
  <div id="photo-box" class="photo-box">
    <img id="photo-img" alt="Cage sheet">
  </div>
  <button id="btn-photo-close" class="photo-close" type="button" aria-label="Close">✕</button>
</dialog>

<!-- Postcodes on an estimated cage's region map (tap EST) -->
<dialog id="dlg-est" class="est-dialog">
  <div class="est-head">
    <h2 id="est-title"></h2>
    <button id="btn-est-close" class="btn-ghost" type="button">Close</button>
  </div>
  <p class="est-sub">Postcodes inside the region map. Estimated, check the map.</p>
  <p id="est-codes" class="est-codes"></p>
  <p class="est-key">* on the map's line · grey = not on this cage in the app yet</p>
  <ul id="est-list" class="est-list"></ul>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
